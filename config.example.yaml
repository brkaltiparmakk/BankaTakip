# Bu dosyayı config.yaml olarak kopyalayıp kendi bilgilerinizle doldurun.
# Şifreler buraya DEĞİL, .env dosyasına yazılır; burada sadece değişken adı verilir.

database: data/bankatakip.db
attachments_dir: data/ekstreler

# İlk taramada kaç gün geriye bakılsın; 0 = tüm geçmiş (varsayılan)
lookback_days: 0

accounts:
  - name: gmail
    provider: gmail            # imap.gmail.com
    email: ornek@gmail.com
    password_env: GMAIL_APP_PASSWORD

  - name: icloud
    provider: icloud           # imap.mail.me.com
    email: ornek@icloud.com
    password_env: ICLOUD_APP_PASSWORD

  # Başka bir IMAP sunucusu için:
  # - name: is-maili
  #   provider: custom
  #   host: imap.ornek.com
  #   port: 993
  #   email: ben@ornek.com
  #   password_env: IS_MAIL_PASSWORD

# Bankalar: ekstre maillerini gönderen adres/alan adı ile eşleştirilir.
# Gönderen adreslerini kendi gelen kutunuzdaki ekstre maillerinden kontrol edin.
banks:
  - name: Garanti BBVA
    senders: ["garantibbva.com.tr", "garanti.com.tr"]
    subject_keywords: ["ekstre", "hesap özeti", "hesap ozeti", "hesap hareketleri"]
    pdf_password_env: GARANTI_PDF_PASSWORD

  - name: Yapı Kredi
    senders: ["yapikredi.com.tr"]
    subject_keywords: ["ekstre", "hesap özeti"]
    pdf_password_env: YAPIKREDI_PDF_PASSWORD

  - name: İş Bankası
    senders: ["isbank.com.tr"]
    subject_keywords: ["ekstre", "hesap özeti"]
    pdf_password_env: ISBANK_PDF_PASSWORD

  - name: Enpara
    senders: ["enpara.com"]
    subject_keywords: ["ekstre", "hesap özeti"]
    pdf_password_env: ENPARA_PDF_PASSWORD

  - name: Akbank
    senders: ["akbank.com"]
    subject_keywords: ["ekstre", "hesap özeti"]
    pdf_password_env: AKBANK_PDF_PASSWORD

