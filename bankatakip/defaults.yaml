# config.yaml'da banks / categories verilmezse kullanılan varsayılanlar.

banks:
  - name: Garanti BBVA
    senders: ["garantibbva.com.tr", "garanti.com.tr"]
    subject_keywords: ["ekstre", "hesap özeti", "hesap ozeti"]
    pdf_password_env: GARANTI_PDF_PASSWORD

  - name: Yapı Kredi
    senders: ["yapikredi.com.tr"]
    subject_keywords: ["ekstre", "hesap özeti"]
    pdf_password_env: YAPIKREDI_PDF_PASSWORD

  - name: İş Bankası
    senders: ["isbank.com.tr"]
    subject_keywords: ["ekstre", "hesap özeti"]
    pdf_password_env: ISBANK_PDF_PASSWORD

  - name: Akbank
    senders: ["akbank.com"]
    subject_keywords: ["ekstre", "hesap özeti"]
    pdf_password_env: AKBANK_PDF_PASSWORD

# İşlem açıklamasına göre otomatik kategori (büyük/küçük harf duyarsız)
categories:
  Market: ["migros", "a101", "bim", "şok", "carrefour", "macro"]
  Yeme-İçme: ["yemeksepeti", "getir", "trendyol yemek", "starbucks", "restoran", "cafe"]
  Ulaşım: ["shell", "opet", "bp", "petrol ofisi", "uber", "bitaksi", "istanbulkart"]
  Alışveriş: ["trendyol", "hepsiburada", "amazon", "n11", "zara", "lc waikiki"]
  Fatura: ["turkcell", "vodafone", "türk telekom", "turk telekom", "enerjisa", "igdaş", "iski"]
  Abonelik: ["netflix", "spotify", "youtube", "apple.com", "icloud", "disney"]
  Ödeme: ["ödeme", "odeme", "payment"]
